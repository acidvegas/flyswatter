# flyswatter - flag bot / scanner / AI-crawler user-agents as $block_ua.
# Edit this list to taste. Broad on purpose.
map $http_user_agent $block_ua {
    default 0;
    ~*(lightpanda|headless|amazonbot|dataforseo|applebot|ttspider|tiktokspider|anthropic|claude|cursor|perplexity|gpt|gemini|crawler|scraper|python|semrush|wayback|archive|facebook|meta|bingbot|google|bytedance|spider|openai|oai-|search|image|yandex|dotbot|ahrefs|scrapy|youbot|rootevidence|ecosyste|baidu|sleepbot|thesurface|polymarket|feedbase) 1;
}

# Optional: don't access-log trapped traffic.
# Use with:  access_log /path/access.log combined if=$loggable;
map $block_ua $loggable {
    1 0;
    0 1;
}
