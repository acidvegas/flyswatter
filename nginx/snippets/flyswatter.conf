# flyswatter - route trapped requests to the trap server.
# Change 127.0.0.1:8899 if you run the container on a different host port.

error_page 461 = @flyswatter;
location @flyswatter {
    proxy_pass http://127.0.0.1:8899;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# .env / .git - matched anywhere so nested scans are caught and any real
# .env/.git sitting in a webroot is shadowed by the fake one.
location ~ /\.(env|git)(/|\.|$) {
    proxy_pass http://127.0.0.1:8899;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Everything else - ROOT-ANCHORED (^/) so files served *inside* git repos
# (gitea, gitweb, etc.) are never shadowed.
location ~* "^/(\.aws|\.ssh|id_rsa|id_ed25519|\.git-credentials|\.npmrc|\.pypirc|\.netrc|\.htpasswd|\.htaccess|\.vscode|wp-config\.php|config\.json|secrets\.json|credentials\.json|docker-compose\.ya?ml|(backup|dump|database|db|mysql|users|data)\.sql)(/|\.|$)" {
    proxy_pass http://127.0.0.1:8899;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
