# Add the two flyswatter lines to any server{} block you want protected.
server {
    listen 443 ssl;
    server_name example.com;

    if ($block_ua) { return 461; }     # bot/AI user-agents -> troll page
    include snippets/flyswatter.conf;     # trap routing + fake-secret endpoints

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;   # ... your real app ...
    }
}
